name: Build Co Tuong
# Toàn bộ game nằm trong file này: workflow tạo index.html rồi deploy lên GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tao game co tuong
        run: |
          mkdir -p dist
          cat > dist/index.html <<'GAME_EOF'
          <!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Tướng</title>
          <style>
          body{margin:0;background:#1b1410;color:#f3dcb8;font-family:system-ui,sans-serif;text-align:center}
          h1{font-size:20px;margin:8px}#st{font-size:17px;min-height:26px;margin:4px;font-weight:600}
          canvas{width:min(96vw,720px);height:auto;touch-action:manipulation}
          button{background:#6b3a1f;color:#ffe9c4;border:0;border-radius:8px;padding:9px 14px;margin:6px 3px;font-size:15px}
          </style></head><body>
          <h1>⚔ CỜ TƯỚNG ⚔</h1><div id="st"></div><canvas id="cv" width="720" height="795"></canvas>
          <div><button id="nw">Ván mới</button><button id="un">Đi lại</button><button id="sn">Âm thanh: Bật</button></div>
          <script>
          const cv=document.getElementById('cv'),X=cv.getContext('2d'),M=60,S=75,W=720,H=795,st=document.getElementById('st');
          const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
          const bc=mk(W,H),bx=bc.getContext('2d'),bl=mk(W,H),blx=bl.getContext('2d');
          const rnd=(a,b)=>a+Math.random()*(b-a),px=c=>M+c*S,py=r=>M+r*S,ok=(r,c)=>r>=0&&r<10&&c>=0&&c<9;
          /* ===== BÀN CỜ ĐẤT SÉT ===== */
          function drawBoard(){
           let g=bx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#c2723f');g.addColorStop(.5,'#b0612f');g.addColorStop(1,'#9a5026');
           bx.fillStyle=g;bx.beginPath();bx.roundRect(8,8,W-16,H-16,18);bx.fill();bx.save();bx.clip();
           for(let i=0;i<9000;i++){bx.fillStyle=Math.random()<.5?'rgba(60,25,10,'+rnd(.05,.25)+')':'rgba(255,190,130,'+rnd(.04,.16)+')';bx.fillRect(rnd(0,W),rnd(0,H),rnd(1,5),rnd(1,4))}
           bx.strokeStyle='rgba(50,20,8,.25)';bx.lineWidth=1;
           for(let i=0;i<60;i++){let x=rnd(0,W),y=rnd(0,H);bx.beginPath();bx.moveTo(x,y);for(let k=0;k<6;k++){x+=rnd(-14,14);y+=rnd(-14,14);bx.lineTo(x,y)}bx.stroke()}
           bx.strokeStyle='#3a1808';bx.lineWidth=3;bx.lineCap='round';
           const L=(x1,y1,x2,y2)=>{bx.beginPath();bx.moveTo(x1,y1);bx.lineTo(x2,y2);bx.stroke()};
           for(let r=0;r<10;r++)L(px(0),py(r),px(8),py(r));
           for(let c=0;c<9;c++){if(c==0||c==8)L(px(c),py(0),px(c),py(9));else{L(px(c),py(0),px(c),py(4));L(px(c),py(5),px(c),py(9))}}
           [[0,3,2,5],[0,5,2,3],[7,3,9,5],[7,5,9,3]].forEach(([a,b,c,d])=>L(px(b),py(a),px(d),py(c)));
           bx.lineWidth=2;
           [[2,1],[2,7],[7,1],[7,7],[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8]].forEach(([r,c])=>{for(const sx of[-1,1])for(const sy of[-1,1]){if(c==0&&sx<0||c==8&&sx>0)continue;const x=px(c)+sx*6,y=py(r)+sy*6;L(x,y,x+sx*12,y);L(x,y,x,y+sy*12)}});
           bx.lineWidth=4;bx.strokeRect(px(0)-10,py(0)-10,8*S+20,9*S+20);
           const a=py(4)+5,b=py(5)-5,g2=bx.createLinearGradient(0,a,0,b);g2.addColorStop(0,'#d8a468');g2.addColorStop(.5,'#e6bb85');g2.addColorStop(1,'#c68f58');
           bx.fillStyle=g2;bx.beginPath();bx.moveTo(0,a);for(let x=0;x<=W;x+=20)bx.lineTo(x,a+Math.sin(x*.05)*4+rnd(-3,3));bx.lineTo(W,b);for(let x=W;x>=0;x-=20)bx.lineTo(x,b+Math.sin(x*.07)*4+rnd(-3,3));bx.fill();
           bx.strokeStyle='rgba(255,245,220,.5)';bx.lineWidth=2;
           for(let i=0;i<14;i++){const y=rnd(a+8,b-8),x=rnd(0,W-120);bx.beginPath();bx.moveTo(x,y);bx.bezierCurveTo(x+30,y-6,x+60,y+6,x+rnd(60,120),y);bx.stroke()}
           bx.restore();bx.fillStyle='rgba(70,30,10,.6)';bx.font='bold 40px KaiTi,"Noto Serif CJK SC",serif';bx.textAlign='center';bx.textBaseline='middle';
           bx.fillText('楚   河',px(2),(a+b)/2);bx.fillText('漢   界',px(6),(a+b)/2)}
          /* ===== MÁU ===== */
          let parts=[];
          function stain(x,y,big){
           for(let i=0;i<(big?40:28);i++){const a=rnd(0,6.28),d=Math.abs(rnd(-1,1))*rnd(5,50),r=rnd(2,i<6?15:7);
            blx.fillStyle='rgba('+Math.floor(rnd(95,150))+',5,8,'+rnd(.55,.9)+')';blx.beginPath();blx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r,0,6.28);blx.fill()}
           blx.lineCap='round';
           for(let i=0;i<6;i++){const a=rnd(0,6.28),d=rnd(20,50),l=rnd(10,30);blx.strokeStyle='rgba(110,4,8,.75)';blx.lineWidth=rnd(2,4);blx.beginPath();blx.moveTo(x+Math.cos(a)*d*.4,y+Math.sin(a)*d*.4);blx.lineTo(x+Math.cos(a)*(d+l),y+Math.sin(a)*(d+l));blx.stroke()}
           blx.fillStyle='rgba(90,0,5,.85)';blx.beginPath();blx.ellipse(x,y,rnd(16,24),rnd(12,20),rnd(0,3),0,6.28);blx.fill();
           blx.fillStyle='rgba(255,130,130,.25)';blx.beginPath();blx.arc(x-5,y-4,4,0,6.28);blx.fill()}
          function blood(x,y,big){stain(x,y,big);for(let i=0;i<(big?60:34);i++){const a=rnd(0,6.28),v=rnd(2,big?11:8);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,r:rnd(2,6)})}}
          /* ===== QUÂN CỜ ĐỒNG ===== */
          const CH=[{R:'俥',H:'傌',E:'相',A:'仕',G:'帥',C:'炮',P:'兵'},{R:'車',H:'馬',E:'象',A:'士',G:'將',C:'砲',P:'卒'}];
          function piece(x,y,t,s,a=1,sc=1){
           X.save();X.globalAlpha=a;X.translate(x,y);X.scale(sc,sc);
           X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.ellipse(4,8,34,30,0,0,6.28);X.fill();
           const p=s?['#8fc3bd','#2f6468','#0d2326','#35c8ff','#c9f4ff']:['#eaa070','#8e3c1c','#3a120a','#ff4a2a','#ffd68a'];
           let g=X.createRadialGradient(-10,-12,4,0,0,36);g.addColorStop(0,p[0]);g.addColorStop(.6,p[1]);g.addColorStop(1,p[2]);
           X.fillStyle=g;X.beginPath();X.arc(0,0,33,0,6.28);X.fill();X.strokeStyle='rgba(0,0,0,.5)';X.lineWidth=2;X.stroke();
           X.strokeStyle='rgba(255,220,170,.35)';X.beginPath();X.arc(0,0,27,0,6.28);X.stroke();
           g=X.createRadialGradient(0,0,2,0,0,24);g.addColorStop(0,p[2]);g.addColorStop(1,p[1]);X.fillStyle=g;X.beginPath();X.arc(0,0,23,0,6.28);X.fill();
           X.shadowColor=p[3];X.shadowBlur=14;X.fillStyle=p[4];X.font='bold 32px KaiTi,"Noto Serif CJK SC","Songti SC",serif';X.textAlign='center';X.textBaseline='middle';X.fillText(CH[s][t],0,2);X.fillText(CH[s][t],0,2);
           X.restore()}
          /* ===== LUẬT CỜ ===== */
          let B,turn,hist,sel,mv,over,anim,ghost,last,snd=true;
          function init(){B=[];for(let r=0;r<10;r++)B.push(Array(9).fill(null));
           const k='RHEAGAEHR';for(let c=0;c<9;c++){B[0][c]={t:k[c],s:1};B[9][c]={t:k[c],s:0}}
           [1,7].forEach(c=>{B[2][c]={t:'C',s:1};B[7][c]={t:'C',s:0}});
           for(let c=0;c<9;c+=2){B[3][c]={t:'P',s:1};B[6][c]={t:'P',s:0}}
           turn=0;hist=[];sel=null;mv=[];over=0;anim=null;ghost=null;last=null;parts=[];blx.clearRect(0,0,W,H);msg()}
          const D4=[[1,0],[-1,0],[0,1],[0,-1]];
          function gen(b,r,c){const p=b[r][c],s=p.s,o=[];
           const add=(y,x)=>{if(ok(y,x)&&(!b[y][x]||b[y][x].s!==s))o.push([y,x])};
           if(p.t=='R')for(const[d,e]of D4){let y=r+d,x=c+e;while(ok(y,x)&&!b[y][x]){o.push([y,x]);y+=d;x+=e}add(y,x)}
           else if(p.t=='C')for(const[d,e]of D4){let y=r+d,x=c+e;while(ok(y,x)&&!b[y][x]){o.push([y,x]);y+=d;x+=e}
            y+=d;x+=e;while(ok(y,x)&&!b[y][x]){y+=d;x+=e}if(ok(y,x)&&b[y][x].s!==s)o.push([y,x])}
           else if(p.t=='H')for(const[d,e]of[[-2,-1],[-2,1],[2,-1],[2,1],[-1,-2],[1,-2],[-1,2],[1,2]]){const ly=r+(Math.abs(d)==2?d/2:0),lx=c+(Math.abs(e)==2?e/2:0);if(!b[ly][lx])add(r+d,c+e)}
           else if(p.t=='E')for(const d of[-2,2])for(const e of[-2,2]){const y=r+d,x=c+e;if(ok(y,x)&&!b[r+d/2][c+e/2]&&(s?y<=4:y>=5))add(y,x)}
           else if(p.t=='A'||p.t=='G'){const L=p.t=='A'?[[1,1],[1,-1],[-1,1],[-1,-1]]:D4;for(const[d,e]of L){const y=r+d,x=c+e;if(x>=3&&x<=5&&(s?y<=2:y>=7))add(y,x)}}
           else{const f=s?1:-1;add(r+f,c);if(s?r>=5:r<=4){add(r,c+1);add(r,c-1)}}
           return o}
          function chk(b,s){let gy,gx,ey,ex;for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c];if(p&&p.t=='G'){if(p.s==s){gy=r;gx=c}else{ey=r;ex=c}}}
           if(gx==ex){let n=0;for(let r=Math.min(gy,ey)+1;r<Math.max(gy,ey);r++)if(b[r][gx])n++;if(!n)return 1}
           for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c];if(p&&p.s!=s&&gen(b,r,c).some(m=>m[0]==gy&&m[1]==gx))return 1}return 0}
          function legal(r,c){const s=B[r][c].s;return gen(B,r,c).filter(([y,x])=>{const cap=B[y][x],p=B[r][c];B[y][x]=p;B[r][c]=null;const bad=chk(B,s);B[r][c]=p;B[y][x]=cap;return!bad})}
          const any=s=>{for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(B[r][c]&&B[r][c].s==s&&legal(r,c).length)return 1;return 0};
          function msg(){st.innerHTML=over?'🏆 '+(turn?'ĐỎ':'XANH')+' THẮNG!':'Lượt: <span style="color:'+(turn?'#6fd3ff':'#ff7a5a')+'">'+(turn?'XANH':'ĐỎ')+'</span>'+(chk(B,turn)?' — CHIẾU TƯỚNG!':'')}
          function go(r,c,y,x){anim={p:B[r][c],r,c,y,x,cap:B[y][x],t:performance.now()};sel=null;mv=[]}
          function land(){const{p,r,c,y,x,cap}=anim;B[y][x]=p;B[r][c]=null;hist.push({r,c,y,x,cap});last=[r,c,y,x];anim=null;
           if(cap){ghost={p:cap,x:px(x),y:py(y),t:performance.now()};blood(px(x),py(y),cap.t=='G');sfx(p.t)}else sfx('mv');
           turn^=1;if(!any(turn)){over=1;setTimeout(()=>sfx('win'),600)}else if(chk(B,turn))setTimeout(()=>sfx('chk'),450);msg()}
          /* ===== ÂM THANH (WebAudio, tổng hợp theo từng quân) ===== */
          let AC,OUT;
          function actx(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createDynamicsCompressor();OUT.connect(AC.destination)}if(AC.state=='suspended')AC.resume()}
          function tone(ty,f0,f1,d,v,dl=0,fc=0,vib=0){const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
           if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib;lg.gain.value=f0*.05;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d)}
           g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);
           if(fc){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;g.connect(f);f.connect(OUT)}else g.connect(OUT);o.start(t);o.stop(t+d+.05)}
          function nz(d,v,dl,ty,f0,f1){const t=AC.currentTime+dl,n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
           const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type=ty;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(OUT);s.start(t)}
          const SF={
           R:()=>{nz(.7,.8,0,'lowpass',900,80);for(let i=0;i<5;i++)tone('square',70+i*5,40,.12,.2,i*.06,400);tone('triangle',160,50,.3,.7,.35);nz(.25,.7,.35,'bandpass',1800,300)}, // Xe: bánh gỗ lăn + va chạm
           H:()=>{tone('sawtooth',500,900,.18,.3,0,2500,9);tone('sawtooth',900,380,.5,.3,.18,2200,12);for(let i=0;i<4;i++)nz(.06,.8,i*.09,'bandpass',700,500);tone('triangle',150,60,.25,.6,.38)}, // Mã: hí + vó ngựa
           E:()=>{tone('sawtooth',220,520,.3,.4,0,1800,6);tone('sawtooth',520,260,.7,.4,.3,1500,5);tone('sine',60,30,.5,.8,.1);nz(.3,.5,.05,'lowpass',500,100)}, // Tượng: voi rống + giẫm
           A:()=>{[1,2.76,5.4,8.9].forEach((m,i)=>{const f=Math.min(900*m,9000);tone('sine',f,f*.99,.5/(i+1)+.1,.3/(i+1))});nz(.15,.6,0,'highpass',3000,6000);tone('triangle',300,100,.2,.4,.05)}, // Sĩ: kiếm chém khiên
           G:()=>{tone('sine',110,45,.9,.9);tone('sine',70,35,1.2,.9);[1,1.5,2.4,3.1].forEach(m=>tone('sine',220*m,215*m,1.4,.2));nz(.5,.5,0,'lowpass',400,60)}, // Tướng: trống trận + chiêng
           C:()=>{nz(.12,.5,0,'bandpass',3000,6000);nz(1.1,1,.12,'lowpass',1400,40);tone('sine',120,28,.9,1,.12);tone('sawtooth',90,30,.4,.4,.12,300)}, // Pháo: nổ đại bác
           P:()=>{nz(.14,.7,0,'highpass',1500,5000);nz(.12,.9,.14,'lowpass',500,120);tone('triangle',180,70,.15,.7,.14)} // Tốt: giáo đâm "phập"
          };
          function sfx(k){if(!snd||!AC)return;
           if(k=='mv'){tone('triangle',420,200,.08,.5);nz(.05,.4,0,'bandpass',1200,800)}
           else if(k=='sel')tone('sine',900,700,.05,.2);
           else if(k=='chk'){tone('square',440,440,.25,.25,0,1200);tone('square',330,330,.4,.25,.25,1200)}
           else if(k=='win')[392,523,659,784,1047].forEach((f,i)=>tone('square',f,f,.4,.2,i*.18,2000));
           else{SF[k]();nz(.4,.7,.08,'bandpass',500,200);tone('sine',90,40,.25,.6,.1)}} // + tiếng máu bắn
          /* ===== VẼ ===== */
          function draw(now){X.clearRect(0,0,W,H);X.drawImage(bc,0,0);
           X.save();X.beginPath();X.roundRect(8,8,W-16,H-16,18);X.clip();X.drawImage(bl,0,0);X.restore();
           if(last)[[last[0],last[1]],[last[2],last[3]]].forEach(([r,c])=>{X.strokeStyle='rgba(255,230,120,.7)';X.lineWidth=3;X.strokeRect(px(c)-36,py(r)-36,72,72)});
           for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=B[r][c];if(!p||anim&&anim.r==r&&anim.c==c)continue;
            if(sel&&sel[0]==r&&sel[1]==c){X.strokeStyle='#ffe27a';X.lineWidth=4;X.shadowColor='#ffd040';X.shadowBlur=16;X.beginPath();X.arc(px(c),py(r),38,0,6.28);X.stroke();X.shadowBlur=0}
            piece(px(c),py(r),p.t,p.s)}
           if(ghost){const a=(now-ghost.t)/500;if(a<1)piece(ghost.x+rnd(-3,3)*(1-a),ghost.y,ghost.p.t,ghost.p.s,1-a,1-a*.4);else ghost=null}
           if(anim){const u=Math.min(1,(now-anim.t)/260),e=u*u*(3-2*u);piece(px(anim.c)+(px(anim.x)-px(anim.c))*e,py(anim.r)+(py(anim.y)-py(anim.r))*e,anim.p.t,anim.p.s,1,1+.18*Math.sin(Math.PI*u));if(u>=1)land()}
           mv.forEach(([y,x])=>{if(B[y][x]){X.strokeStyle='rgba(255,60,40,.85)';X.lineWidth=4;X.beginPath();X.arc(px(x),py(y),37,0,6.28);X.stroke()}else{X.fillStyle='rgba(120,255,140,.65)';X.beginPath();X.arc(px(x),py(y),11,0,6.28);X.fill()}});
           parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;p.l-=.035;if(p.l<=0){blx.fillStyle='rgba(115,4,8,.7)';blx.beginPath();blx.arc(p.x,p.y,p.r*.6,0,6.28);blx.fill();return 0}
            X.fillStyle='rgba(150,5,10,'+p.l+')';X.beginPath();X.arc(p.x,p.y,p.r,0,6.28);X.fill();return 1});
           requestAnimationFrame(draw)}
          /* ===== ĐIỀU KHIỂN ===== */
          cv.onpointerdown=e=>{actx();if(anim||over)return;const q=cv.getBoundingClientRect(),k=W/q.width,x=Math.round(((e.clientX-q.left)*k-M)/S),y=Math.round(((e.clientY-q.top)*k-M)/S);if(!ok(y,x))return;
           if(sel&&mv.some(m=>m[0]==y&&m[1]==x))return go(sel[0],sel[1],y,x);
           const p=B[y][x];if(p&&p.s==turn){sel=[y,x];mv=legal(y,x);sfx('sel')}else{sel=null;mv=[]}};
          nw.onclick=init;un.onclick=()=>{if(anim||!hist.length)return;const h=hist.pop();B[h.r][h.c]=B[h.y][h.x];B[h.y][h.x]=h.cap;turn^=1;over=0;sel=null;mv=[];last=null;msg()};
          sn.onclick=()=>{snd=!snd;sn.textContent='Âm thanh: '+(snd?'Bật':'Tắt')};
          drawBoard();init();requestAnimationFrame(draw);
          </script></body></html>
          GAME_EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
