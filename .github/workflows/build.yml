name: Build Co Tuong APK
# Toàn bộ game (quân cờ + bàn cờ của bạn, hiệu ứng, âm thanh) + project Android nằm trong file này.
# Push lên main -> tự build APK -> tạo Release để tải về điện thoại.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chap nhan license Android SDK (SDK co san tren runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Tao project Android + game + hinh anh
        run: |
          mkdir -p android/app/src/main/assets/img
