            });
          }
          function scheduleAI() {
            if (S.mode !== 'ai' || S.over || !S.G || S.G.pos.side === S.my) return;
            S.thinking = true; updateHud();
            setTimeout(function () {
              if (!S.G || S.over) return;
              var m = XQ.bestMove(S.G.pos, S.level);
              S.thinking = false;
              if (!m) { return; }
              doMove((m / 90) | 0, m % 90, false);
            }, 450);
          }

          function finish(over) {
            S.over = over; S.ended = true; updateHud();
            var t, sub = '';
            var rs = { 'chieu-bi': 'Chiếu bí!', 'het-nuoc': 'Hết nước đi – thua.', 'lap-lai': 'Hòa do lặp lại nước đi.', 'khong-an-quan': 'Hòa do 60 nước không ăn quân.', 'xin-thua': 'Đối phương xin thua.', 'thoat': 'Đối thủ đã thoát.', 'xin-thua-ban': 'Bạn đã xin thua.' };
            if (!over.winner) t = 'HÒA';
            else if (S.mode === 'local') t = sideName(over.winner) + ' thắng!';
            else t = over.winner === S.my ? 'BẠN THẮNG!' : (S.mode === 'ai' ? 'MÁY THẮNG' : 'BẠN THUA');
            sub = rs[over.reason] || '';
            if (over.winner && S.mode !== 'local') { if (over.winner === S.my) XQAudio.win(); else XQAudio.lose(); } else if (over.winner) XQAudio.win();
            $('ovTitle').textContent = t; $('ovSub').textContent = sub;
            if (over.reason === 'chieu-bi') banner('CHIẾU BÍ!');
            setTimeout(function () { $('over').classList.remove('hidden'); }, over.reason === 'chieu-bi' ? 1200 : 400);
          }

          function undo() {
            if (S.busy || S.thinking || !S.G || S.mode === 'online' || !S.G.history.length) return;
            var n = 1;
            if (S.mode === 'ai' && S.G.pos.side === S.my && S.G.history.length >= 2) n = 2;
            if (S.mode === 'ai' && S.G.pos.side !== S.my) n = 1;
            for (var i = 0; i < n; i++) S.G.undo();
            S.disp = new Int8Array(S.G.pos.b); S.sel = -1; S.targets = []; S.over = null; S.ended = false;
            var h = S.G.history[S.G.history.length - 1]; S.last = h ? { from: (h.m / 90) | 0, to: h.m % 90 } : null;
            $('over').classList.add('hidden'); updateHud();
            if (S.mode === 'ai' && S.G.pos.side !== S.my) scheduleAI();
          }

          /* ============ Menu ============ */
          function panel(id) {
            ['pHome', 'pAi', 'pOnline', 'pSet'].forEach(function (p) { $(p).classList.toggle('hidden', p !== id); });
          }
          function showMenu() {
            $('menu').classList.remove('hidden'); panel('pHome');
            $('mResume').classList.toggle('hidden', !(S.started && !S.ended));
          }
          function hideMenu() { $('menu').classList.add('hidden'); }
          function seg(rowId, cb) {
            var row = $(rowId);
            row.addEventListener('click', function (e) {
              var b = e.target.closest('button'); if (!b) return;
              [].forEach.call(row.children, function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); cb(+b.getAttribute('data-v'));
            });
          }
          function setSeg(rowId, v) { [].forEach.call($(rowId).children, function (b) { b.classList.toggle('sel', +b.getAttribute('data-v') === v); }); }

          var aiSide = 1, onSide = 1;
          function startAI() { S.mode = 'ai'; S.level = cfg.level; S.my = aiSide; S.view = aiSide; hideMenu(); newGame(); }
          function startLocal() { S.mode = 'local'; S.my = RED; S.view = RED; hideMenu(); newGame(); }

          /* ---- Online ---- */
          var pendingAgain = false, hostColor = RED;
          function onStat(t) { $('onStat').textContent = t || ''; }
          function startOnline(my) {
            S.mode = 'online'; S.my = my; S.view = my; hideMenu(); newGame();
            toast('Bạn cầm quân ' + sideName(my), 2200);
          }
          function netInit() {
            XQNet.on('hosting', function (code) { $('onCode').textContent = code; $('onCode').classList.remove('hidden'); onStat('Đang chờ đối thủ nhập mã…'); });
            XQNet.on('connected', function () {
              onStat('Đã kết nối!');
              if (XQNet.isHost()) {
                hostColor = onSide === 0 ? (Math.random() < 0.5 ? RED : BLK) : onSide;
                XQNet.send({ t: 'start', you: -hostColor });
                startOnline(hostColor);
              }
            });
            XQNet.on('error', function (m) { onStat(m); toast(m, 2800); });
            XQNet.on('closed', function () {
              if (S.mode === 'online' && S.started && !S.over) { toast('Đối thủ đã thoát', 2500); finish({ winner: S.my, reason: 'thoat' }); }
              else if (S.mode === 'online') toast('Đối thủ đã thoát', 2500);
            });
            XQNet.on('msg', function (d) {
              if (!d || !d.t) return;
              if (d.t === 'start') { startOnline(d.you === BLK ? BLK : RED); }
              else if (d.t === 'mv') {
                if (!S.G || S.G.pos.side === S.my) return;
                var f = d.f | 0, to = d.to | 0;
                doMove(f, to, true).then(function (ok) { if (!ok) toast('Nhận nước đi không hợp lệ', 2500); });
              } else if (d.t === 'resign') { finish({ winner: S.my, reason: 'xin-thua' }); }
              else if (d.t === 'again') { pendingAgain = true; ask('Đối thủ muốn chơi ván mới. Đồng ý?', function (y) { if (y) { XQNet.send({ t: 'ok' }); if (XQNet.isHost()) rematchHost(); } else XQNet.send({ t: 'no' }); }); }
              else if (d.t === 'ok') { if (XQNet.isHost()) rematchHost(); }
              else if (d.t === 'no') { toast('Đối thủ từ chối', 2000); }
            });
          }
          function rematchHost() { hostColor = -hostColor; XQNet.send({ t: 'start', you: -hostColor }); startOnline(hostColor); }

          var askCb = null;
          function ask(text, cb) { $('askT').textContent = text; askCb = cb; $('ask').classList.remove('hidden'); }

          /* ============ Khởi động ============ */
          function applyCfg() {
            XQAudio.setEnabled(cfg.snd); XQAudio.setVolume(cfg.vol / 100);
            $('sSnd').textContent = cfg.snd ? 'Bật' : 'Tắt'; $('sGore').textContent = cfg.gore ? 'Bật' : 'Tắt';
            $('sShake').textContent = cfg.shake ? 'Bật' : 'Tắt'; $('sHint').textContent = cfg.hint ? 'Bật' : 'Tắt';
            $('sVol').value = cfg.vol; $('bSnd').textContent = cfg.snd ? '🔊' : '🔇';
            setSeg('lvRow', cfg.level);
          }
          function boot() {
            cv.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(e.clientX, e.clientY); });
            window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
            document.addEventListener('pointerdown', function () { XQAudio.init(); }, { once: false });
            $('mAi').onclick = function () { panel('pAi'); };
            $('mLocal').onclick = startLocal;
            $('mOnline').onclick = function () { panel('pOnline'); onStat(XQNet.available() ? '' : 'Thiếu thư viện online – chưa dùng được.'); };
            $('mSet').onclick = function () { panel('pSet'); };
            $('mResume').onclick = hideMenu;
            [].forEach.call(document.querySelectorAll('.back'), function (b) { b.onclick = function () { XQNet.close(); $('onCode').classList.add('hidden'); onStat(''); panel('pHome'); }; });
            seg('lvRow', function (v) { cfg.level = v; saveCfg(); });
            seg('sideRow', function (v) { aiSide = v; });
            seg('onSide', function (v) { onSide = v; });
            $('aiGo').onclick = startAI;
            $('onHost').onclick = function () { onStat('Đang tạo phòng…'); $('onCode').classList.add('hidden'); XQNet.host(); };
            $('onJoin').onclick = function () {
              var v = $('onInput').value.trim(); if (v.length < 5) { onStat('Nhập đủ 5 ký tự mã phòng.'); return; }
              onStat('Đang vào phòng…'); XQNet.join(v);
            };
            $('sSnd').onclick = function () { cfg.snd = !cfg.snd; saveCfg(); applyCfg(); };
            $('bSnd').onclick = function () { cfg.snd = !cfg.snd; saveCfg(); applyCfg(); XQAudio.init(); };
            $('sGore').onclick = function () { cfg.gore = !cfg.gore; saveCfg(); applyCfg(); };
            $('sShake').onclick = function () { cfg.shake = !cfg.shake; saveCfg(); applyCfg(); };
            $('sHint').onclick = function () { cfg.hint = !cfg.hint; saveCfg(); applyCfg(); };
            $('sVol').oninput = function () { cfg.vol = +this.value; saveCfg(); applyCfg(); };
            $('bUndo').onclick = undo;
            $('bFlip').onclick = function () { S.view = -S.view; S.sel = -1; S.targets = []; updateHud(); };
            $('bMenu').onclick = showMenu;
            $('bResign').onclick = function () {
              if (!S.G || S.over) return;
              ask('Bạn chắc chắn muốn xin thua?', function (y) {
                if (!y) return;
                if (S.mode === 'online') XQNet.send({ t: 'resign' });
                finish({ winner: S.mode === 'local' ? -S.G.pos.side : -S.my, reason: 'xin-thua-ban' });
              });
            };
            $('ovAgain').onclick = function () {
              if (S.mode === 'online') { XQNet.send({ t: 'again' }); toast('Đã gửi lời mời chơi lại…', 2200); $('over').classList.add('hidden'); return; }
              $('over').classList.add('hidden'); newGame();
            };
            $('ovMenu').onclick = function () { $('over').classList.add('hidden'); showMenu(); };
            $('ovView').onclick = function () { $('over').classList.add('hidden'); };
            $('askYes').onclick = function () { $('ask').classList.add('hidden'); if (askCb) askCb(true); askCb = null; };
            $('askNo').onclick = function () { $('ask').classList.add('hidden'); if (askCb) askCb(false); askCb = null; };
            applyCfg(); netInit(); S.G = new XQ.Game(); S.disp = new Int8Array(S.G.pos.b); S.started = false;
            fit(); updateHud(); showMenu();
            requestAnimationFrame(loop);
          }
          var lastBack = 0;
          window.__xqBack = function () {
            if (!$('ask').classList.contains('hidden')) { $('ask').classList.add('hidden'); return true; }
            if (!$('over').classList.contains('hidden')) { $('over').classList.add('hidden'); return true; }
            if (!$('menu').classList.contains('hidden')) {
              if ($('pHome').classList.contains('hidden')) { XQNet.close(); panel('pHome'); return true; }
              var t = Date.now();
              if (t - lastBack < 2000) return false;
              lastBack = t; toast('Nhấn Back lần nữa để thoát', 1800); return true;
            }
            showMenu(); return true;
          };
          window.__xq = { step: step, S: S, doMove: doMove, newGame: newGame, cfg: cfg, startAI: startAI, startLocal: startLocal, sqXY: sqXY };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
          })();
          XQ_EOF

