name: Build Nen Video APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tao source code tu base64
        run: |
          echo "" | base64 -d > "settings.gradle.kts"
          echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjI0IiBhcHBseSBmYWxzZQp9Cg==" | base64 -d > "build.gradle.kts"
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgzZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==" | base64 -d > "gradle.properties"
          mkdir -p "app"
          echo "" | base64 -d > "app/build.gradle.kts"
          mkdir -p "app/src/main"
          echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "app/src/main/res/values"
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPk7DqW4gVmlkZW88L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==" | base64 -d > "app/src/main/res/values/strings.xml"
          mkdir -p "app/src/main/res/values"
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJUaGVtZS5OZW5WaWRlbyIgcGFyZW50PSJUaGVtZS5NYXRlcmlhbDMuRGF5TmlnaHQuTm9BY3Rpb25CYXIiIC8+CjwvcmVzb3VyY2VzPgo=" | base64 -d > "app/src/main/res/values/themes.xml"
          mkdir -p "app/src/main/res/layout"
          echo "" | base64 -d > "app/src/main/res/layout/activity_main.xml"
          mkdir -p "app/src/main/java/com/straight/nenvideo"
          echo "" | base64 -d > "app/src/main/java/com/straight/nenvideo/MainActivity.kt"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NenVideo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
