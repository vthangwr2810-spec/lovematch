# =====================================================================
#  CỜ TƯỚNG KỲ ĐÀI – game cờ tướng chơi với máy, giao diện thủy mặc.
#  Toàn bộ mã nguồn, hình ảnh, phông chữ nằm trong file này (dạng base64).
#  Cách dùng:
#    1. Tạo repo GitHub, lưu file này tại  .github/workflows/build.yml
#    2. Push lên nhánh main (hoặc tab Actions → "Build Co Tuong Ky Dai" → Run workflow)
#    3. Nhận kết quả:
#         • APK cài điện thoại: tab Releases ("Cờ Tướng Kỳ Đài (bản mới nhất)") hoặc Artifacts "CoTuongKyDai-apk"
#         • Bản web: Artifacts "CoTuongKyDai-web" (hoặc GitHub Pages nếu bật Settings → Pages → Source: GitHub Actions)
#  Tính năng: máy 5 cấp, Elo & hạng, thành tích, 3 bàn cờ, nhạc nền, âm thanh riêng từng quân,
#  máu đổ khi ăn quân, gợi ý / đi lại / xin hòa, đồng hồ, lưu & tiếp tục ván.
# =====================================================================
name: Build Co Tuong Ky Dai

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-co-tuong-ky-dai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Tạo thư mục"
        run: |
          mkdir -p www
          mkdir -p android/app/src/main/java/vn/cotuong/kydai
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/assets/www

