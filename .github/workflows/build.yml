name: Build Family Locator (APK + Admin Site)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Giải nén toàn bộ source code (được nhúng base64 bên dưới)
  #         ra thành các file thật, rồi build file APK Android
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (chỉ để có thư mục làm việc)
        uses: actions/checkout@v4

      - name: Giải mã toàn bộ mã nguồn từ base64
        run: |

          mkdir -p "$(dirname "android-app/app/src/main/AndroidManifest.xml")"
          echo "" | base64 -d > "android-app/app/src/main/AndroidManifest.xml"

          mkdir -p "$(dirname "android-app/app/src/main/java/com/familylocator/app/ApiClient.kt")"
          echo "" | base64 -d > "android-app/app/src/main/java/com/familylocator/app/ApiClient.kt"

          mkdir -p "$(dirname "android-app/app/src/main/java/com/familylocator/app/LocationService.kt")"
          echo "" | base64 -d > "android-app/app/src/main/java/com/familylocator/app/LocationService.kt"

          mkdir -p "$(dirname "android-app/app/src/main/java/com/familylocator/app/DeviceConfig.kt")"
          echo "" | base64 -d > "android-app/app/src/main/java/com/familylocator/app/DeviceConfig.kt"

          mkdir -p "$(dirname "android-app/app/src/main/java/com/familylocator/app/MainActivity.kt")"
          echo "" | base64 -d > "android-app/app/src/main/java/com/familylocator/app/MainActivity.kt"

          mkdir -p "$(dirname "android-app/app/src/main/java/com/familylocator/app/BootReceiver.kt")"
          echo "" | base64 -d > "android-app/app/src/main/java/com/familylocator/app/BootReceiver.kt"

          mkdir -p "$(dirname "android-app/app/build.gradle")"
          echo "" | base64 -d > "android-app/app/build.gradle"

          mkdir -p "$(dirname "android-app/build.gradle")"
          echo "" | base64 -d > "android-app/build.gradle"

          mkdir -p "$(dirname "android-app/settings.gradle")"
          echo "cm9vdFByb2plY3QubmFtZSA9ICJGYW1pbHlMb2NhdG9yIgppbmNsdWRlICc6YXBwJwo=" | base64 -d > "android-app/settings.gradle"

          mkdir -p "$(dirname "android-app/gradle.properties")"
          echo "YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9ZmFsc2UKb3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQo=" | base64 -d > "android-app/gradle.properties"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"

          mkdir -p "$(dirname "android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png")"
          echo "" | base64 -d > "android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png"

          mkdir -p "$(dirname "admin-dashboard/index.html")"
          echo "" | base64 -d > "admin-dashboard/index.html"

          mkdir -p "$(dirname "supabase-schema.sql")"
          echo "" | base64 -d > "supabase-schema.sql"

          mkdir -p "$(dirname "supabase-edge-function/index.ts")"
          echo "" | base64 -d > "supabase-edge-function/index.ts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Tạo Gradle wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.7

      - name: Build APK (debug)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-locator-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload trang quản trị làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard
          path: admin-dashboard/index.html

      - name: Upload schema + edge function làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backend
          path: |
            supabase-schema.sql
            supabase-edge-function/index.ts

  # ============================================================
  # Job 2 (tuỳ chọn): Tự deploy trang quản trị lên GitHub Pages
  # Bật bằng cách vào Settings > Pages > Source = GitHub Actions
  # ============================================================
  deploy-admin-site:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-dashboard
          path: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
