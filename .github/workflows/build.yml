      - name: "Ghi www/net.js"
        run: |
          cat > www/net.js <<'XQ_EOF'
          /* Chơi online qua WebRTC (PeerJS) – mã phòng 5 ký tự, không cần máy chủ riêng */
          (function (root) {
          'use strict';
          var PREFIX = 'xqvn-', CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
          var peer = null, conn = null, handlers = {}, role = null, code = '';

          function available() { return typeof root.Peer === 'function'; }
          function rndCode() { var s = ''; for (var i = 0; i < 5; i++) s += CH[Math.floor(Math.random() * CH.length)]; return s; }
          function opts() {
            return { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
          }
          function emit(n, a) { if (handlers[n]) handlers[n](a); }

          function hookConn(c) {
            conn = c;
            c.on('open', function () { emit('connected'); });
            c.on('data', function (d) { emit('msg', d); });
            c.on('close', function () { emit('closed'); });
            c.on('error', function (e) { emit('error', 'Lỗi kết nối: ' + (e && e.type || e)); });
          }

          function close() {
            try { if (conn) conn.close(); } catch (e) {}
            try { if (peer) peer.destroy(); } catch (e) {}
            conn = null; peer = null; role = null; code = '';
          }

          function host(tries) {
            close(); role = 'host'; tries = tries || 0;
            if (!available()) { emit('error', 'Thiếu thư viện online (peerjs).'); return; }
            code = rndCode();
            peer = new root.Peer(PREFIX + code, opts());
            peer.on('open', function () { emit('hosting', code); });
            peer.on('connection', function (c) {
              if (conn && conn.open) { try { c.close(); } catch (e) {} return; }
              hookConn(c);
            });
            peer.on('error', function (e) {
              if (e && e.type === 'unavailable-id' && tries < 6) { host(tries + 1); return; }
              emit('error', 'Không tạo được phòng (' + (e && e.type || e) + ').');
            });
            peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
          }

          function join(c) {
            close(); role = 'guest'; code = String(c || '').toUpperCase().trim();
            if (!available()) { emit('error', 'Thiếu thư viện online (peerjs).'); return; }
            peer = new root.Peer(opts());
            var timer = setTimeout(function () { emit('error', 'Hết thời gian chờ. Kiểm tra mã phòng hoặc mạng.'); }, 20000);
            peer.on('open', function () {
              var cn = peer.connect(PREFIX + code, { reliable: true });
              cn.on('open', function () { clearTimeout(timer); });
              hookConn(cn);
            });
            peer.on('error', function (e) {
              clearTimeout(timer);
              if (e && e.type === 'peer-unavailable') emit('error', 'Không tìm thấy phòng ' + code + '.');
              else emit('error', 'Lỗi mạng (' + (e && e.type || e) + ').');
            });
          }

          function send(o) { try { if (conn && conn.open) { conn.send(o); return true; } } catch (e) {} return false; }

          root.XQNet = {
            available: available, host: host, join: join, send: send, close: close,
            on: function (n, f) { handlers[n] = f; },
            isHost: function () { return role === 'host'; },
            connected: function () { return !!(conn && conn.open); }
          };
          })(typeof window !== 'undefined' ? window : globalThis);
          XQ_EOF

      - name: "Ghi www/game.js"
