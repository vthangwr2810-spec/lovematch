# Thư Đố - tự tạo trang game và đăng lên GitHub Pages.
# Cách dùng: đặt file này tại .github/workflows/build.yml,
# vào Settings > Pages > Source chọn "GitHub Actions", rồi push lên nhánh main.
name: Build Thu Do

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo trang game
        run: |
          mkdir -p site
          cat > site/index.html <<'THUDO_EOF'
          <!doctype html>
          <html lang="vi">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Thư Đố</title>
          <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%89%EF%B8%8F%3C/text%3E%3C/svg%3E">
          <style>
          :root{--bg:#e9eef4;--card:#fbfcfe;--ink:#1d2a44;--soft:#5a6a86;--red:#d6453d;--blue:#2f6fb5;--ok:#1f8a63;--line:#c9d3e1;color-scheme:light}
          @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111a2b;--card:#1a2640;--ink:#e8eefb;--soft:#9fb0cf;--red:#ef6a61;--blue:#6aa6e8;--ok:#4fcf9f;--line:#2c3b5c;color-scheme:dark}}
          *{box-sizing:border-box}
          html,body{margin:0}
          body{background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Palatino Linotype",serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
          main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
          h1{font-size:2rem;margin:8px 0 2px;letter-spacing:.5px}
          .sub{color:var(--soft);margin:0 0 20px}
          .sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 18px;position:relative}
          .sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--card) 12px 20px,var(--blue) 20px 32px,var(--card) 32px 40px)}
          .sheet>:first-child{margin-top:10px}
          .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:inherit;font:inherit;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
          .item:hover{border-color:var(--blue)}
          .item b{display:block}
          .item small{color:var(--soft)}
          .stamp{margin-left:auto;font:600 .75rem system-ui,sans-serif;border:2px solid var(--soft);color:var(--soft);border-radius:4px;padding:2px 8px;transform:rotate(-6deg)}
          .item.done .stamp{border-color:var(--ok);color:var(--ok)}
          .puzzle{font-size:1.2rem;white-space:pre-wrap;margin:6px 0 16px}
          input,textarea{width:100%;font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px 2px;margin:0 0 12px;outline:0}
          input:focus,textarea:focus{border-color:var(--blue)}
          label{display:block;color:var(--soft);font:.85rem system-ui,sans-serif}
          button.b{font:600 1rem system-ui,sans-serif;background:var(--ink);color:var(--card);border:0;border-radius:6px;padding:10px 18px;margin:0 8px 8px 0;cursor:pointer}
          button.b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
          button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
          .msg{margin:12px 0 0;min-height:1.4em;font-family:system-ui,sans-serif}
          .bad{color:var(--red)}.good{color:var(--ok)}
          .reply{border-left:4px solid var(--ok);padding:4px 0 4px 14px;margin:14px 0;font-style:italic}
          .link{font:.85rem system-ui,sans-serif}
          @media(prefers-reduced-motion:no-preference){.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
          </style>
          </head>
          <body>
          <main>
          <h1>Thư Đố</h1>
          <p class="sub">Giải câu đố để mở thư. Rồi viết một lá thư đố gửi cho người khác.</p>
          
          <section id="inbox"></section>
          
          <section id="letter" hidden></section>
          
          <section id="compose" hidden>
          <div class="sheet">
          <label for="cf">Tên của bạn</label><input id="cf" maxlength="30">
          <label for="cp">Câu đố</label><textarea id="cp" rows="3" maxlength="300"></textarea>
          <label for="ca">Đáp án (nhiều đáp án ngăn cách bằng dấu |)</label><input id="ca" maxlength="60">
          <label for="ch">Gợi ý (không bắt buộc)</label><input id="ch" maxlength="120">
          <label for="cm">Lời nhắn mở ra khi giải đúng</label><textarea id="cm" rows="3" maxlength="300"></textarea>
          <button class="b" id="mk">Tạo liên kết thư</button><button class="b alt" id="cb">Quay lại</button>
          <p class="msg" id="cmsg"></p>
          <input id="clink" class="link" readonly hidden>
          <button class="b" id="cc" hidden>Sao chép liên kết</button>
          </div>
          </section>
          </main>
          
          <script>
          var L=[
          {id:1,f:"Lan, Đà Nẵng",p:"3, 6, 12, 24, ?",a:"48",h:"Mỗi số gấp mấy lần số đứng trước nó?",m:"Mình học được rằng nhân đôi mỗi ngày một chút, sau một năm sẽ thành chuyện lớn. Chúc bạn một ngày nhân đôi niềm vui."},
          {id:2,f:"Minh, Huế",p:"Mật mã: KDQK SKXF\nMỗi chữ cái bị đẩy tiến lên 3 vị trí trong bảng chữ cái. Hãy giải mã.",a:"hanh phuc",h:"K lùi 3 bước là H.",m:"Hạnh phúc của mình là ly cà phê buổi sáng và một người nhắn tin hỏi hôm nay bạn có khỏe không. Hôm nay mình hỏi bạn đó."},
          {id:3,f:"Bà Tư, Cần Thơ",p:"Có cổ mà chẳng có đầu,\nCó miệng không răng, đựng nhiều thứ hay.\nLà gì?",a:"chai|cai chai",h:"Nó nằm trên bàn ăn.",m:"Bà thương cháu. Nhớ ăn cơm đúng bữa nghe con."},
          {id:4,f:"Hùng, Hà Nội",p:"2 con mèo bắt 2 con chuột trong 2 phút.\nHỏi 100 con mèo bắt 100 con chuột trong mấy phút?",a:"2|2 phut|hai",h:"Mỗi con mèo bắt mấy con chuột trong 2 phút?",m:"Nhiều người lúc đầu trả lời 100. Bạn nghĩ chậm lại một chút và ra đáp án đúng, giỏi lắm."},
          {id:5,f:"Thảo, Đà Lạt",p:"1, 1, 2, 3, 5, 8, ?",a:"13",h:"Cộng hai số liền trước.",m:"Dãy số này có trong hoa hướng dương và vỏ ốc. Hôm nay nếu thấy thứ gì đẹp tự nhiên, hãy dừng lại nhìn một lát."},
          {id:6,f:"Khoa, Sài Gòn",p:"Càng lấy đi thì càng lớn.\nLà gì?",a:"ho|cai ho|lo|cai lo",h:"Hãy nghĩ đến cái xẻng.",m:"Có những thứ càng bớt đi càng rộng ra, như lo lắng trong đầu. Chúc bạn tối nay đầu óc thật thoáng."}
          ];
          var $=function(i){return document.getElementById(i)};
          var done={};
          try{done=JSON.parse(localStorage.getItem("thudo")||"{}")}catch(e){}
          function save(){try{localStorage.setItem("thudo",JSON.stringify(done))}catch(e){}}
          function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
          function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
          function show(v){["inbox","letter","compose"].forEach(function(x){$(x).hidden=x!==v});window.scrollTo(0,0)}
          function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
          function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
          
          function inbox(){
            var n=Object.keys(done).length,h='<p class="sub">Đã mở '+n+'/'+L.length+' thư.</p>';
            L.forEach(function(l){
              var d=done[l.id];
              h+='<button class="item'+(d?' done':'')+'" data-id="'+l.id+'"><span><b>Thư từ '+esc(l.f)+'</b><small>'+(d?'Đã giải':'Đang khóa')+'</small></span><span class="stamp">'+(d?'ĐÃ MỞ':'MỚI')+'</span></button>';
            });
            h+='<button class="b" id="wr" style="margin-top:8px">Viết thư đố</button>';
            $("inbox").innerHTML=h;
            $("inbox").querySelectorAll(".item").forEach(function(b){b.onclick=function(){openLetter(L.filter(function(l){return l.id==b.dataset.id})[0])}});
            $("wr").onclick=function(){show("compose")};
            show("inbox");
          }
          
          function openLetter(l){
            var d=l.id&&done[l.id];
            $("letter").innerHTML='<div class="sheet"><p class="sub" style="margin-bottom:4px">Thư từ '+esc(l.f)+'</p>'
             +'<div class="puzzle">'+esc(l.p)+'</div>'
             +'<label for="ans">Câu trả lời của bạn</label><input id="ans" autocomplete="off">'
             +'<button class="b" id="ck">Mở thư</button><button class="b alt" id="hn">Xem gợi ý</button><button class="b alt" id="bk">Về hộp thư</button>'
             +'<p class="msg" id="out"></p></div>';
            $("bk").onclick=function(){location.hash="";inbox()};
            $("hn").onclick=function(){$("out").className="msg";$("out").textContent=l.h?"Gợi ý: "+l.h:"Người gửi không để lại gợi ý."};
            function check(){
              var v=norm($("ans").value),ok=String(l.a).split("|").some(function(x){return norm(x)===v&&v});
              if(ok){
                if(l.id){done[l.id]=1;save()}
                $("out").className="msg good";
                $("out").innerHTML='Đúng rồi, thư đã mở.<div class="reply">'+esc(l.m||"")+'</div>';
              }else{
                $("out").className="msg bad";$("out").textContent="Chưa đúng. Thử lại hoặc xem gợi ý.";
                $("ans").classList.remove("shake");void $("ans").offsetWidth;$("ans").classList.add("shake");
              }
            }
            $("ck").onclick=check;
            $("ans").onkeydown=function(e){if(e.key==="Enter")check()};
            show("letter");$("ans").focus();
          }
          
          $("cb").onclick=function(){show("inbox")};
          $("mk").onclick=function(){
            var o={f:$("cf").value.trim()||"Người lạ",p:$("cp").value.trim(),a:$("ca").value.trim(),h:$("ch").value.trim(),m:$("cm").value.trim()};
            if(!o.p||!o.a){$("cmsg").className="msg bad";$("cmsg").textContent="Cần nhập câu đố và đáp án.";return}
            var url=location.href.split("#")[0]+"#l="+enc(o);
            $("clink").value=url;$("clink").hidden=false;$("cc").hidden=false;
            $("cmsg").className="msg good";$("cmsg").textContent="Gửi liên kết này cho bạn bè. Người mở sẽ thấy đúng lá thư của bạn.";
          };
          $("cc").onclick=function(){
            $("clink").select();
            try{navigator.clipboard.writeText($("clink").value);$("cmsg").textContent="Đã sao chép."}catch(e){document.execCommand("copy")}
          };
          
          function route(){
            var m=location.hash.match(/^#l=(.+)$/);
            if(m){try{openLetter(dec(m[1]));return}catch(e){}}
            inbox();
          }
          window.addEventListener("hashchange",route);
          route();
          </script>
          </body>
          </html>
          THUDO_EOF
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
