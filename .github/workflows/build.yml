      - name: "Ghi www/engine.js"
        run: |
          cat > www/engine.js <<'XQ_EOF'
          /* Cờ Tướng engine: luật đi, chiếu tướng, hết cờ, AI alpha-beta */
          (function (root) {
          'use strict';
          var R = 1, H = 2, E = 3, A = 4, K = 5, C = 6, P = 7;      // xe, mã, tượng, sĩ, tướng, pháo, tốt
          var RED = 1, BLK = -1;
          var NAMES = { 1: 'xe', 2: 'ma', 3: 'tuong', 4: 'si', 5: 'tuongq', 6: 'phao', 7: 'tot' };
          var VN = { 1: 'Xe', 2: 'Mã', 3: 'Tượng', 4: 'Sĩ', 5: 'Tướng', 6: 'Pháo', 7: 'Tốt' };
          var ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          var DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

          // zobrist cố định
          var seed = 123456789;
          function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
          var ZK = new Int32Array(90 * 15);
          for (var zi = 0; zi < ZK.length; zi++) ZK[zi] = rnd();

          function Pos() {
            this.b = new Int8Array(90);
            this.side = RED;
            this.kp = [-1, -1];
            this.stack = [];
            this.hash = 0;
          }
          Pos.prototype.setup = function () {
            var back = [R, H, E, A, K, A, E, H, R];
            this.b.fill(0);
            for (var c = 0; c < 9; c++) {
              this.b[c] = -back[c];
              this.b[81 + c] = back[c];
            }
            this.b[2 * 9 + 1] = -C; this.b[2 * 9 + 7] = -C;   // pháo đen
            this.b[7 * 9 + 1] = C; this.b[7 * 9 + 7] = C;
            for (var i = 0; i < 5; i++) { this.b[3 * 9 + i * 2] = -P; this.b[6 * 9 + i * 2] = P; }
            this.side = RED; this.stack = [];
            this.recalc();
          };
          Pos.prototype.recalc = function () {
            this.kp = [-1, -1]; this.hash = 0;
            for (var s = 0; s < 90; s++) {
              var p = this.b[s]; if (!p) continue;
              if (p === K) this.kp[0] = s; else if (p === -K) this.kp[1] = s;
              this.hash ^= ZK[s * 15 + p + 7];
            }
            if (this.side === BLK) this.hash ^= 0x5bd1e995;
          };
          Pos.prototype.clone = function () {
            var q = new Pos(); q.b.set(this.b); q.side = this.side; q.kp = this.kp.slice(); q.hash = this.hash; return q;
          };
          Pos.prototype.make = function (m) {
            var from = (m / 90) | 0, to = m - from * 90, b = this.b, p = b[from], cap = b[to];
            b[to] = p; b[from] = 0;
            this.hash ^= ZK[from * 15 + p + 7] ^ ZK[to * 15 + p + 7] ^ 0x5bd1e995;
            if (cap) this.hash ^= ZK[to * 15 + cap + 7];
            if (p === K) this.kp[0] = to; else if (p === -K) this.kp[1] = to;
            this.stack.push(m, cap);
            this.side = -this.side;
            return cap;
          };
          Pos.prototype.unmake = function () {
            var cap = this.stack.pop(), m = this.stack.pop();
            var from = (m / 90) | 0, to = m - from * 90, b = this.b, p = b[to];
            b[from] = p; b[to] = cap;
            this.hash ^= ZK[from * 15 + p + 7] ^ ZK[to * 15 + p + 7] ^ 0x5bd1e995;
            if (cap) this.hash ^= ZK[to * 15 + cap + 7];
            if (p === K) this.kp[0] = from; else if (p === -K) this.kp[1] = from;
            this.side = -this.side;
          };

          function sgn(x) { return x > 0 ? 1 : -1; }

          // Sinh nước đi giả hợp lệ (chưa lọc tướng bị chiếu)
          function gen(pos, side, capsOnly) {
            var b = pos.b, out = [];
            for (var s = 0; s < 90; s++) {
              var p = b[s];
              if (!p || sgn(p) !== side) continue;
              var t = p > 0 ? p : -p, r = (s / 9) | 0, c = s - r * 9, d, rr, cc, q, to;
              var base = s * 90;
              if (t === R) {
                for (d = 0; d < 4; d++) {
                  rr = r + ORTH[d][0]; cc = c + ORTH[d][1];
                  while (rr >= 0 && rr < 10 && cc >= 0 && cc < 9) {
                    q = b[rr * 9 + cc];
                    if (!q) { if (!capsOnly) out.push(base + rr * 9 + cc); }
                    else { if (sgn(q) !== side) out.push(base + rr * 9 + cc); break; }
                    rr += ORTH[d][0]; cc += ORTH[d][1];
                  }
                }
              } else if (t === C) {
                for (d = 0; d < 4; d++) {
                  rr = r + ORTH[d][0]; cc = c + ORTH[d][1];
                  var screen = false;
                  while (rr >= 0 && rr < 10 && cc >= 0 && cc < 9) {
                    q = b[rr * 9 + cc];
                    if (!screen) {
                      if (!q) { if (!capsOnly) out.push(base + rr * 9 + cc); } else screen = true;
                    } else if (q) {
                      if (sgn(q) !== side) out.push(base + rr * 9 + cc);
                      break;
                    }
                    rr += ORTH[d][0]; cc += ORTH[d][1];
                  }
                }
              } else if (t === H) {
                for (d = 0; d < 4; d++) {
                  var dr = ORTH[d][0], dc = ORTH[d][1];
                  var lr = r + dr, lc = c + dc;
                  if (lr < 0 || lr > 9 || lc < 0 || lc > 8 || b[lr * 9 + lc]) continue;
                  for (var k = -1; k <= 1; k += 2) {
                    rr = dr !== 0 ? r + 2 * dr : r + k;
                    cc = dr !== 0 ? c + k : c + 2 * dc;
                    if (rr < 0 || rr > 9 || cc < 0 || cc > 8) continue;
                    q = b[rr * 9 + cc];
                    if (q && sgn(q) === side) continue;
                    if (capsOnly && !q) continue;
                    out.push(base + rr * 9 + cc);
                  }
                }
              } else if (t === E) {
                for (d = 0; d < 4; d++) {
                  rr = r + DIAG[d][0] * 2; cc = c + DIAG[d][1] * 2;
                  if (rr < 0 || rr > 9 || cc < 0 || cc > 8) continue;
                  if (side === RED ? rr < 5 : rr > 4) continue;
                  if (b[(r + DIAG[d][0]) * 9 + c + DIAG[d][1]]) continue;
                  q = b[rr * 9 + cc];
                  if (q && sgn(q) === side) continue;
                  if (capsOnly && !q) continue;
                  out.push(base + rr * 9 + cc);
                }
              } else if (t === A) {
                for (d = 0; d < 4; d++) {
                  rr = r + DIAG[d][0]; cc = c + DIAG[d][1];
                  if (cc < 3 || cc > 5) continue;
                  if (side === RED ? (rr < 7 || rr > 9) : (rr < 0 || rr > 2)) continue;
                  q = b[rr * 9 + cc];
                  if (q && sgn(q) === side) continue;
                  if (capsOnly && !q) continue;
                  out.push(base + rr * 9 + cc);
                }
              } else if (t === K) {
                for (d = 0; d < 4; d++) {
                  rr = r + ORTH[d][0]; cc = c + ORTH[d][1];
                  if (cc < 3 || cc > 5) continue;
                  if (side === RED ? (rr < 7 || rr > 9) : (rr < 0 || rr > 2)) continue;
                  q = b[rr * 9 + cc];
                  if (q && sgn(q) === side) continue;
                  if (capsOnly && !q) continue;
                  out.push(base + rr * 9 + cc);
                }
              } else if (t === P) {
                var f = side === RED ? -1 : 1;
                rr = r + f;
                if (rr >= 0 && rr < 10) {
                  q = b[rr * 9 + c];
                  if (!(q && sgn(q) === side) && !(capsOnly && !q)) out.push(base + rr * 9 + c);
                }
                var crossed = side === RED ? r <= 4 : r >= 5;
                if (crossed) {
                  for (var sd = -1; sd <= 1; sd += 2) {
                    cc = c + sd; if (cc < 0 || cc > 8) continue;
                    q = b[r * 9 + cc];
                    if (q && sgn(q) === side) continue;
                    if (capsOnly && !q) continue;
                    out.push(base + r * 9 + cc);
                  }
                }
              }
            }
            return out;
          }

