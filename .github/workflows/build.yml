# =====================================================================
#  CỜ TƯỜNG – toàn bộ game nằm trong file này (không cần file nào khác).
#  Cách dùng:
#    1. Tạo repo GitHub, lưu file này tại  .github/workflows/build.yml
#    2. Push lên nhánh main (hoặc vào tab Actions → "Build Co Tuong" → Run workflow)
#    3. Nhận kết quả:
#         • APK cài điện thoại: tab Releases ("Cờ Tướng (bản mới nhất)") hoặc Artifacts "CoTuong-apk"
#         • Bản web: Artifacts "CoTuong-web" (hoặc GitHub Pages nếu bạn bật
#           Settings → Pages → Source: GitHub Actions)
#  Bộ quân (gốm đỏ / đồng xanh) và bàn cờ cẩm thạch được nhúng dạng base64 ở cuối file.
#  Chơi online: tạo phòng → gửi mã 5 ký tự cho bạn bè (WebRTC/PeerJS, không cần server riêng).
# =====================================================================
name: Build Co Tuong

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-co-tuong
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Tạo thư mục"
        run: |
          mkdir -p www
          mkdir -p android/app/src/main/java/vn/cotuong/game
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/assets/www

      - name: "Ghi www/index.html"
        run: |
          cat > www/index.html <<'XQ_EOF'
          <!doctype html>
          <html lang="vi">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="theme-color" content="#0d1114">
          <title>Cờ Tướng</title>
          <link rel="stylesheet" href="style.css">
          </head>
          <body>
          <div id="app">
            <div class="pl" id="plTop"><span class="dot" id="dotTop"></span><b id="nameTop">Máy</b><span class="turn" id="turnTop">đang nghĩ…</span><canvas id="trayTop"></canvas></div>
            <main id="stage">
              <canvas id="cv"></canvas>
              <div id="toast"></div>
              <div id="banner"></div>
            </main>
            <div class="pl" id="plBot"><span class="dot" id="dotBot"></span><b id="nameBot">Bạn</b><span class="turn" id="turnBot">đến lượt bạn</span><canvas id="trayBot"></canvas></div>
            <div id="btns">
              <button id="bUndo">↶ Đi lại</button>
              <button id="bFlip">⟳ Lật bàn</button>
              <button id="bResign">⚑ Xin thua</button>
              <button id="bSnd">🔊</button>
              <button id="bMenu">☰ Menu</button>
            </div>

            <!-- MENU -->
            <div id="menu" class="screen">
              <div class="card" id="pHome">
                <h1>CỜ TƯỚNG</h1>
                <div class="sub">Quân gốm đỏ &amp; quân đồng xanh · máu đổ chiến trường</div>
                <button class="pri big" id="mAi">Chơi với máy</button>
                <button class="big" id="mLocal">Hai người (chung một máy)</button>
                <button class="big" id="mOnline">Chơi online</button>
                <button class="big" id="mSet">Cài đặt</button>
                <button class="big hidden" id="mResume">Tiếp tục ván đang chơi</button>
              </div>

              <div class="card hidden" id="pAi">
                <h2>Chơi với máy</h2>
                <div class="lbl">Độ khó</div>
                <div class="row" id="lvRow"><button data-v="1">Dễ</button><button data-v="2" class="sel">Vừa</button><button data-v="3">Khó</button></div>
                <div class="lbl">Bạn cầm quân</div>
                <div class="row" id="sideRow"><button data-v="1" class="sel">Đỏ (đi trước)</button><button data-v="-1">Xanh</button></div>
                <button class="pri big" id="aiGo">Bắt đầu</button>
                <button class="big back">‹ Quay lại</button>
              </div>

              <div class="card hidden" id="pOnline">
                <h2>Chơi online</h2>
                <p id="onHint">Tạo phòng rồi gửi mã 5 ký tự cho bạn bè, hoặc nhập mã để vào phòng.</p>
                <div class="lbl">Bạn cầm quân (khi tạo phòng)</div>
                <div class="row" id="onSide"><button data-v="1" class="sel">Đỏ</button><button data-v="-1">Xanh</button><button data-v="0">Ngẫu nhiên</button></div>
                <button class="pri big" id="onHost">Tạo phòng</button>
                <div class="code hidden" id="onCode">-----</div>
                <div class="sub" id="onStat"></div>
                <input type="text" id="onInput" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off" autocapitalize="characters">
                <button class="big" id="onJoin">Vào phòng</button>
                <button class="big back" id="onBack">‹ Quay lại</button>
              </div>

              <div class="card hidden" id="pSet">
                <h2>Cài đặt</h2>
                <div class="tog"><span>Âm thanh</span><button id="sSnd">Bật</button></div>
                <div class="tog" style="flex-direction:column;align-items:stretch;gap:6px"><span>Âm lượng</span><input type="range" id="sVol" min="0" max="100" value="90"></div>
                <div class="tog"><span>Máu &amp; hiệu ứng đẫm máu</span><button id="sGore">Bật</button></div>
                <div class="tog"><span>Rung màn hình khi ăn quân</span><button id="sShake">Bật</button></div>
                <div class="tog"><span>Gợi ý nước đi</span><button id="sHint">Bật</button></div>
                <button class="big back">‹ Quay lại</button>
              </div>
            </div>

            <!-- KẾT THÚC -->
            <div id="over" class="modal hidden">
              <div class="card">
                <div class="res" id="ovTitle">Đỏ thắng!</div>
                <p id="ovSub"></p>
                <button class="pri big" id="ovAgain">Ván mới</button>
                <button class="big" id="ovMenu">Về menu</button>
                <button class="big" id="ovView">Xem lại bàn cờ</button>
              </div>
            </div>
            <div id="ask" class="modal hidden">
              <div class="card">
                <div class="res" style="font-size:22px" id="askT">Đối thủ muốn chơi lại</div>
                <div class="row"><button class="pri" id="askYes">Đồng ý</button><button id="askNo">Từ chối</button></div>
              </div>
            </div>
          </div>
          <style>.hidden{display:none!important}</style>
          <script src="peerjs.min.js" onerror="window.__noPeer=1"></script>
          <script src="data.js"></script>
          <script src="engine.js"></script>
          <script src="audio.js"></script>
          <script src="net.js"></script>
          <script src="game.js"></script>
          </body>
          </html>
          XQ_EOF

      - name: "Ghi www/style.css"
        run: |
          cat > www/style.css <<'XQ_EOF'
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
          html,body{margin:0;height:100%;background:#0d1114;color:#eadfc4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden;touch-action:manipulation}
          body{background:radial-gradient(ellipse at 50% 30%,#232b30 0%,#12171a 60%,#090c0e 100%)}
          #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
          .pl{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:44px}
          .pl .dot{width:12px;height:12px;border-radius:50%;flex:none;background:#555;box-shadow:0 0 0 2px #0006 inset}
          .pl .dot.red{background:#c42b24}.pl .dot.blue{background:#2f86d8}
          .pl b{font-size:15px;white-space:nowrap}
          .pl .turn{font-size:12px;color:#d9b95f;opacity:0;transition:opacity .2s;white-space:nowrap}
          .pl.active .turn{opacity:1}
          .pl.active b{color:#ffe08a}
          .pl canvas{flex:1;min-width:0;height:30px}
          #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
          #cv{display:block;touch-action:none}
          #toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#000a;border:1px solid #c9a44c88;color:#ffe9b0;padding:6px 14px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:94%}
          #toast.show{opacity:1}
          #banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:900;font-size:clamp(34px,11vw,64px);letter-spacing:2px;color:#fff;text-shadow:0 0 18px #e22,0 3px 0 #700,0 0 40px #f00;opacity:0;transform:scale(.6);pointer-events:none}
          #banner.show{animation:ban 1.3s ease-out forwards}
          @keyframes ban{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
          #btns{display:flex;gap:8px;padding:6px 10px 8px;justify-content:center;flex-wrap:wrap}
          button{font:inherit;color:#f3e6bd;background:linear-gradient(#323a40,#20262a);border:1px solid #6d5d33;border-radius:12px;padding:10px 14px;font-size:14px;min-height:44px}
          button:active{transform:translateY(1px);filter:brightness(1.2)}
          button.pri{background:linear-gradient(#e2bf62,#a98228);color:#2a1d02;font-weight:700;border-color:#f3d98a}
          button.big{width:100%;font-size:17px;padding:14px}
          button:disabled{opacity:.4}
          button.sel{background:linear-gradient(#e2bf62,#a98228);color:#2a1d02;border-color:#f3d98a;font-weight:700}
          .screen{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#25303a,#0b0f12 75%);display:flex;align-items:center;justify-content:center;z-index:20;padding:18px;overflow:auto}
          .screen.hidden,.modal.hidden{display:none}
          .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
          .card h1{margin:0 0 6px;text-align:center;font-size:44px;letter-spacing:6px;color:#e9c76b;text-shadow:0 2px 0 #5a4210,0 0 22px #b8860b88;font-family:"Noto Serif CJK SC","Noto Serif",serif}
          .card h2{margin:0;text-align:center;font-size:22px;color:#e9c76b}
          .card p{margin:0;text-align:center;color:#b9ad8d;font-size:14px;line-height:1.45}
          .sub{text-align:center;color:#a99d7d;font-size:13px;margin-top:-4px}
          .row{display:flex;gap:8px}.row>*{flex:1}
          .lbl{font-size:13px;color:#b9ad8d;margin-bottom:-4px}
          input[type=text]{font:inherit;font-size:24px;letter-spacing:6px;text-align:center;text-transform:uppercase;width:100%;padding:12px;border-radius:12px;border:1px solid #6d5d33;background:#12171a;color:#ffe9b0;user-select:text;-webkit-user-select:text}
          input[type=range]{width:100%}
          .code{font-size:40px;letter-spacing:10px;text-align:center;font-weight:800;color:#ffe08a;background:#12171a;border:1px dashed #c9a44c;border-radius:14px;padding:12px;user-select:text;-webkit-user-select:text}
          .tog{display:flex;align-items:center;justify-content:space-between;background:#171d21;border:1px solid #3b4046;border-radius:12px;padding:10px 14px}
          .modal{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:18px}
          .modal .card{background:linear-gradient(#242c31,#14191c);border:1px solid #c9a44c;border-radius:18px;padding:22px}
          .res{font-size:30px;font-weight:900;text-align:center;color:#ffe08a;text-shadow:0 0 14px #b8860b}
          XQ_EOF

