      - name: "Tải PeerJS (chơi online)"
        run: |
          set +e
          mkdir -p /tmp/peer && cd /tmp/peer
          npm pack peerjs@1.5.4 >/dev/null 2>&1 && tar xzf peerjs-*.tgz && cp package/dist/peerjs.min.js "$GITHUB_WORKSPACE/www/peerjs.min.js"
          if [ ! -s "$GITHUB_WORKSPACE/www/peerjs.min.js" ]; then
            curl -fsSL https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js -o "$GITHUB_WORKSPACE/www/peerjs.min.js"
          fi
          if [ -s "$GITHUB_WORKSPACE/www/peerjs.min.js" ]; then echo "PeerJS OK"; else echo "::warning::Không tải được PeerJS – chế độ online sẽ bị tắt, chơi máy/2 người vẫn bình thường."; fi

      - name: "Kiểm tra mã nguồn"
        run: |
          for f in www/engine.js www/audio.js www/net.js www/game.js www/data.js; do node --check "$f"; done
          ls -la www
          node -e "
          const XQ=require('./www/engine.js');
          const p=new XQ.Pos(); p.setup();
          const r=[1,2,3].map(d=>XQ.perft(p,d)).join(',');
          console.log('perft',r);
          if(r!=='44,1920,79666'){process.exit(1)}"

      - name: "Lưu bản web (artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: CoTuong-web
          path: www

      - name: "Chuẩn bị GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: "Ghi android/settings.gradle"
        run: |
          cat > android/settings.gradle <<'XQ_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CoTuong"
          include ':app'
          XQ_EOF

      - name: "Ghi android/build.gradle"
        run: |
          cat > android/build.gradle <<'XQ_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          XQ_EOF

      - name: "Ghi android/gradle.properties"
        run: |
          cat > android/gradle.properties <<'XQ_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          XQ_EOF

      - name: "Ghi android/app/build.gradle"
        run: |
          cat > android/app/build.gradle <<'XQ_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'vn.cotuong.game'
              compileSdk 34

              defaultConfig {
                  applicationId 'vn.cotuong.game'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              // Không nén file web để WebView đọc nhanh
              androidResources {
                  noCompress 'webp', 'js', 'html', 'css'
              }
          }
          XQ_EOF

      - name: "Ghi android/app/src/main/AndroidManifest.xml"
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XQ_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XQ_EOF

      - name: "Ghi android/app/src/main/res/values/strings.xml"
        run: |
          cat > android/app/src/main/res/values/strings.xml <<'XQ_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Cờ Tướng</string>
          </resources>
          XQ_EOF

      - name: "Ghi android/app/src/main/res/values/styles.xml"
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'XQ_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#0D1114</item>
                  <item name="android:navigationBarColor">#0D1114</item>
              </style>
          </resources>
          XQ_EOF

      - name: "Ghi android/app/src/main/java/vn/cotuong/game/MainActivity.java"
        run: |
          cat > android/app/src/main/java/vn/cotuong/game/MainActivity.java <<'XQ_EOF'
          package vn.cotuong.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0D1114"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){try{return window.__xqBack?window.__xqBack():false}catch(e){return false}})()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String v) {
                              if (!"true".equals(v)) {
                                  finish();
                              }
                          }
                      });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          XQ_EOF

      - name: "Đưa game vào ứng dụng Android"
        run: cp -r www/. android/app/src/main/assets/www/

      - name: "Cài JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Cài Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: "Build APK"
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: "Đổi tên APK"
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CoTuong.apk

      - name: "Lưu APK (artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: CoTuong-apk
          path: CoTuong.apk

      - name: "Phát hành APK (Releases → latest)"
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest CoTuong.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cờ Tướng (bản mới nhất)" --notes "APK cài trực tiếp trên Android. Bản dựng từ commit $GITHUB_SHA."

  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: "Đưa lên GitHub Pages"
        id: deploy
        uses: actions/deploy-pages@v4
